<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>요거뜨</title>

  <link rel="icon" type="image/png" href="/images/yogodde_01.png" />

  <!-- 폰트 정의: JS 의존 없이 HTML에서 직접 로드 (iOS WebKit 호환) -->
  <style>
    @font-face {
      font-family: 'SUIT-Regular';
      src: url('/fonts/SUIT-Regular.woff2') format('woff2'),
           url('/fonts/SUIT-Regular.woff') format('woff');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SEBANG_Gothic_Bold';
      src: url('/fonts/SEBANG_Gothic_Bold.woff2') format('woff2'),
           url('/fonts/SEBANG_Gothic_Bold.woff') format('woff');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    /* JS 로딩 전 FOUT 방지용 기본 폰트 적용 */
    body, * {
      font-family: 'SUIT-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
