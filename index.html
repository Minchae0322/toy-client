<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>요거뜨</title>

  <link rel="icon" type="image/png" href="/images/yogodde_01.png" />

  <!-- 폰트 프리로드 - iOS Safari에서 폰트 로딩 지연 방지 -->
  <link rel="preload" href="/fonts/SUIT-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/SEBANG_Gothic_Bold.woff" as="font" type="font/woff" crossorigin />
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
<script>
// iOS Safari 폰트 로딩 보장 - Font Loading API 사용
if ('fonts' in document) {
  document.fonts.ready.then(function() {
    document.documentElement.classList.add('fonts-loaded');
  });
  // 3초 타임아웃 - 폰트 로딩 실패 시에도 앱 정상 표시
  setTimeout(function() {
    document.documentElement.classList.add('fonts-loaded');
  }, 3000);
}
</script>
</body>
</html>
