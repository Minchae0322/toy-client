<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>요거뜨</title>

  <link rel="icon" type="image/png" href="/images/yogodde_01.png" />

  <!-- 폰트 preload: iOS에서 볼드체 깨짐 방지 -->
  <link rel="preload" href="/fonts/SUIT-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/SUIT-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/SUIT-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/SUIT-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- 폰트 정의: 각 weight별 실제 폰트 파일 사용 (iOS Safari 호환) -->
  <style>
    /* SUIT 폰트 - 각 weight별 실제 폰트 파일 매핑 */
    @font-face {
      font-family: 'SUIT';
      src: url('/fonts/SUIT-Regular.woff2') format('woff2'),
           url('/fonts/SUIT-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SUIT';
      src: url('/fonts/SUIT-Medium.woff2') format('woff2'),
           url('/fonts/SUIT-Medium.woff') format('woff');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SUIT';
      src: url('/fonts/SUIT-SemiBold.woff2') format('woff2'),
           url('/fonts/SUIT-SemiBold.woff') format('woff');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SUIT';
      src: url('/fonts/SUIT-Bold.woff2') format('woff2'),
           url('/fonts/SUIT-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SEBANG_Gothic_Bold';
      src: url('/fonts/SEBANG_Gothic_Bold.woff2') format('woff2'),
           url('/fonts/SEBANG_Gothic_Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    /* JS 로딩 전 FOUT 방지용 기본 폰트 적용 */
    body, * {
      font-family: 'SUIT', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
