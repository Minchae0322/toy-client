<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
  <!-- base -->
  <rect width="400" height="260" fill="#F5EBFF"/>
  <rect y="0"   width="400" height="60"  fill="#EDE0FF"/>
  <rect y="200" width="400" height="60"  fill="#E9D5FF"/>

  <!-- decorative dot pattern -->
  <g fill="#C084FC" opacity="0.35">
    <circle cx="36"  cy="30"  r="3"/>
    <circle cx="84"  cy="18"  r="2.5"/>
    <circle cx="134" cy="34"  r="3"/>
    <circle cx="296" cy="24"  r="3"/>
    <circle cx="348" cy="46"  r="2.5"/>
    <circle cx="374" cy="22"  r="3"/>
    <circle cx="30"  cy="220" r="3"/>
    <circle cx="82"  cy="238" r="2.5"/>
    <circle cx="300" cy="224" r="3"/>
    <circle cx="356" cy="238" r="3"/>
  </g>

  <!-- sparkles -->
  <g fill="#FDE047">
    <path d="M58 94 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M340 120 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M320 184 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z"/>
  </g>

  <!-- top-left NEW badge -->
  <g transform="translate(24, 70)">
    <rect width="56" height="22" rx="11" fill="#7C2D12"/>
    <path d="M10 11 Q 14 6 12 2 Q 18 4 20 10 Q 22 6 22 3 Q 28 9 26 15 Q 24 18 18 18 Q 12 18 10 15 Z" fill="#FDE047"/>
    <text x="36" y="15" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="10" font-weight="800" fill="#FDE047" letter-spacing="1">HOT</text>
  </g>

  <!-- big headline inside art -->
  <text x="24" y="116" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="22" font-weight="800" fill="#4C1D95" letter-spacing="-1">보라빛 한잔</text>
  <text x="24" y="140" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="-0.2">지금 뜨는 우베 트렌드</text>

  <!-- rating row -->
  <g transform="translate(24, 152)">
    <rect width="44" height="16" rx="8" fill="#FFFFFF"/>
    <path d="M8 8 l2 -4 l2 4 l4 0 l-3 3 l1 4 l-4 -2 l-4 2 l1 -4 l-3 -3 z" fill="#F59E0B"/>
    <text x="28" y="12" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="9" font-weight="800" fill="#4C1D95">4.8</text>
  </g>

  <!-- hero cup -->
  <g transform="translate(238, 56)">
    <!-- shadow pad -->
    <ellipse cx="58" cy="160" rx="52" ry="6" fill="#C4B5FD" opacity="0.55"/>
    <!-- cup body -->
    <path d="M14 4 L102 4 L92 152 Q 58 160 24 152 Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="2.5"/>
    <!-- lid/rim -->
    <rect x="10" y="0" width="96" height="6" rx="2" fill="#4C1D95"/>
    <!-- drink top layer -->
    <path d="M20 18 L96 18 L92 58 Q 58 68 24 58 Z" fill="#C084FC"/>
    <!-- drink bottom darker -->
    <path d="M24 58 Q 58 68 92 58 L88 108 Q 58 116 28 108 Z" fill="#A855F7"/>
    <!-- tapioca pearls -->
    <circle cx="36" cy="98"  r="4"   fill="#3B0764"/>
    <circle cx="50" cy="104" r="4"   fill="#3B0764"/>
    <circle cx="66" cy="102" r="4"   fill="#3B0764"/>
    <circle cx="80" cy="96"  r="4"   fill="#3B0764"/>
    <circle cx="58" cy="110" r="3.5" fill="#3B0764"/>
    <circle cx="42" cy="112" r="3"   fill="#3B0764"/>
    <!-- cream swirl on top -->
    <ellipse cx="58" cy="16" rx="34" ry="7" fill="#FFFFFF"/>
    <ellipse cx="58" cy="11" rx="26" ry="6" fill="#FEF9C3"/>
    <circle  cx="58" cy="4"  r="5"      fill="#FFFFFF"/>
    <!-- cherry on top -->
    <circle cx="58" cy="-4" r="5" fill="#EF4444"/>
    <path d="M58 -8 Q 62 -14 68 -14" stroke="#15803D" stroke-width="1.8" fill="none"/>
    <!-- straw -->
    <rect x="68" y="-20" width="8" height="46" fill="#EF4444"/>
    <rect x="68" y="-20" width="8" height="6" fill="#FCA5A5"/>
    <!-- sleeve -->
    <path d="M18 92 L98 92 L96 120 L20 120 Z" fill="#F3E8FF"/>
    <text x="58" y="110" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="9" font-weight="800" fill="#7C3AED" letter-spacing="1.4">UBE LATTE</text>
  </g>

  <!-- ube root illustration bottom-left -->
  <g transform="translate(44, 180)">
    <ellipse cx="28" cy="24" rx="30" ry="16" fill="#7C3AED"/>
    <ellipse cx="28" cy="22" rx="26" ry="13" fill="#A855F7"/>
    <!-- ube leaf -->
    <path d="M28 10 Q 22 -4 10 -4 Q 22 2 28 10 Z" fill="#16A34A"/>
    <path d="M28 10 Q 34 -4 46 -4 Q 34 2 28 10 Z" fill="#22C55E"/>
    <!-- highlights -->
    <ellipse cx="20" cy="18" rx="6" ry="2.5" fill="#C084FC" opacity="0.8"/>
  </g>

  <!-- bottom collab-style strip -->
  <g transform="translate(200, 236)">
    <rect x="-88" y="-12" width="176" height="22" rx="11" fill="#FDE047"/>
    <text x="0" y="3" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="10" font-weight="800" fill="#7C2D12" letter-spacing="1.5">UBE LATTE TREND</text>
  </g>

  <!-- top-right EVENT badge -->
  <g transform="translate(370, 14)">
    <rect x="-20" y="-10" width="40" height="18" rx="4" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="3" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="9" font-weight="800" fill="#7E22CE">NEW</text>
  </g>
</svg>
