<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" preserveAspectRatio="xMidYMid slice">
  <!-- base cream -->
  <rect width="720" height="160" fill="#FFFBFF"/>

  <!-- right visual panel -->
  <rect x="420" y="0" width="300" height="160" fill="#F3E8FF"/>
  <rect x="640" y="0" width="80"  height="160" fill="#E9D5FF"/>

  <!-- curve divider between panels -->
  <path d="M420 0 Q 390 80 420 160 L 440 160 Q 410 80 440 0 Z" fill="#F3E8FF"/>

  <!-- brand chip -->
  <g transform="translate(48, 22)">
    <rect width="92" height="22" rx="11" fill="#0A0E1A"/>
    <circle cx="14" cy="11" r="3.5" fill="#9333EA"/>
    <text x="56" y="15" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">CAFE TREND</text>
  </g>

  <!-- headline -->
  <text x="48" y="78" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="36" font-weight="900" fill="#18181B" letter-spacing="-1.5">우베라떼</text>
  <text x="48" y="100" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="-0.3">이번 주 인기 1위 &middot; 리뷰 1.2K</text>

  <!-- rating stars -->
  <g transform="translate(48, 114)">
    <path d="M0 8 l2 -5 l2 5 l5 0 l-4 3 l1.5 5 l-4.5 -3 l-4.5 3 l1.5 -5 l-4 -3 z" fill="#F59E0B"/>
    <path d="M18 8 l2 -5 l2 5 l5 0 l-4 3 l1.5 5 l-4.5 -3 l-4.5 3 l1.5 -5 l-4 -3 z" fill="#F59E0B"/>
    <path d="M36 8 l2 -5 l2 5 l5 0 l-4 3 l1.5 5 l-4.5 -3 l-4.5 3 l1.5 -5 l-4 -3 z" fill="#F59E0B"/>
    <path d="M54 8 l2 -5 l2 5 l5 0 l-4 3 l1.5 5 l-4.5 -3 l-4.5 3 l1.5 -5 l-4 -3 z" fill="#F59E0B"/>
    <path d="M72 8 l2 -5 l2 5 l5 0 l-4 3 l1.5 5 l-4.5 -3 l-4.5 3 l1.5 -5 l-4 -3 z" fill="#F59E0B"/>
    <text x="88" y="12" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="12" font-weight="800" fill="#18181B">4.8</text>
  </g>

  <!-- price tag -->
  <g transform="translate(48, 136)">
    <rect width="120" height="16" rx="3" fill="#FEF3C7"/>
    <text x="8" y="12" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="10" font-weight="800" fill="#92400E" letter-spacing="-0.2">EVENT &middot; 5,500원부터</text>
  </g>

  <!-- sparkles around product -->
  <g fill="#FDE047">
    <path d="M412 36 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M664 112 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M432 128 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z"/>
  </g>

  <!-- subtle ube slice background -->
  <g opacity="0.45">
    <circle cx="640" cy="36"  r="20" fill="#C084FC"/>
    <circle cx="640" cy="36"  r="12" fill="#A855F7"/>
  </g>

  <!-- hero cup -->
  <g transform="translate(478, 22)">
    <!-- spotlight halo -->
    <ellipse cx="62" cy="74" rx="70" ry="58" fill="#FFFFFF" opacity="0.6"/>
    <!-- shadow -->
    <ellipse cx="62" cy="126" rx="48" ry="6" fill="#7C3AED" opacity="0.25"/>
    <!-- cup body -->
    <path d="M14 10 L110 10 L100 120 Q 62 128 24 120 Z" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3"/>
    <!-- rim -->
    <rect x="10" y="4" width="104" height="10" rx="3" fill="#4C1D95"/>
    <rect x="14" y="6" width="96"  height="3"  rx="1" fill="#A78BFA"/>
    <!-- drink layers -->
    <path d="M22 28 L102 28 L98 64 Q 62 74 26 64 Z" fill="#C084FC"/>
    <path d="M26 64  Q 62 74 98 64  L94 100 Q 62 108 30 100 Z" fill="#A855F7"/>
    <!-- pearls -->
    <circle cx="36" cy="90"  r="4" fill="#3B0764"/>
    <circle cx="50" cy="96"  r="4" fill="#3B0764"/>
    <circle cx="66" cy="94"  r="4" fill="#3B0764"/>
    <circle cx="80" cy="88"  r="4" fill="#3B0764"/>
    <circle cx="56" cy="102" r="3.5" fill="#3B0764"/>
    <!-- cream top -->
    <ellipse cx="62" cy="22" rx="36" ry="8" fill="#FFFFFF"/>
    <ellipse cx="62" cy="16" rx="28" ry="7" fill="#FEF9C3"/>
    <circle  cx="62" cy="6"  r="6"           fill="#FFFFFF"/>
    <!-- cherry -->
    <circle cx="62" cy="-4" r="6" fill="#EF4444"/>
    <path d="M62 -10 Q 68 -18 76 -18" stroke="#15803D" stroke-width="2" fill="none"/>
    <!-- straw -->
    <rect x="74" y="-22" width="9" height="46" fill="#EF4444"/>
    <rect x="74" y="-22" width="9" height="6" fill="#FCA5A5"/>
    <!-- sleeve -->
    <path d="M20 78 L106 78 L102 104 L24 104 Z" fill="#F3E8FF"/>
    <text x="62" y="97" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="10" font-weight="900" fill="#7C3AED" letter-spacing="1.8">UBE LATTE</text>
  </g>

  <!-- NEW ribbon -->
  <g transform="translate(586, 12) rotate(12)">
    <rect x="-24" y="-10" width="48" height="20" fill="#EF4444"/>
    <polygon points="-24,-10 -30,0 -24,10" fill="#B91C1C"/>
    <polygon points="24,-10 30,0 24,10" fill="#B91C1C"/>
    <text x="0" y="4" text-anchor="middle" font-family="'SUIT','Noto Sans KR',sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">NEW</text>
  </g>

  <!-- footer micro-line -->
  <rect x="240" y="146" width="152" height="2" fill="#9333EA" opacity="0.25"/>
</svg>
