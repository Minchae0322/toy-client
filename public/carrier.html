/* ===== 유틸 ===== */
const CUBE_S=27,CUBE_M=45,CUBE_L=63;
const CVB={x1:30,y1:50,x2:270,y2:370,vw:300,vh:400};
function getBounds(W,H){const sx=W/CVB.vw,sy=H/CVB.vh,sc=Math.min(sx,sy),ox=(W-CVB.vw*sc)/2,oy=(H-CVB.vh*sc)/2;return{left:ox+CVB.x1*sc,top:oy+CVB.y1*sc,right:ox+CVB.x2*sc,bottom:oy+CVB.y2*sc};}
function decoToSvg(arr){const bx=30,by=50,bw=240,bh=320;return arr.map(d=>({type:"emoji",x:bx+(d.x/100)*bw,y:by+(d.y/100)*bh,emoji:d.emoji,size:Math.round(24*d.scale),flipped:d.flipped||false}));}

function getRankStyle(r,t){
if(r===1)return{bg:"radial-gradient(circle at 35% 30%, rgba(167,139,250,0.95) 0%, rgba(124,58,237,0.85) 50%, rgba(91,33,182,0.9) 100%)",border:"rgba(124,58,237,0.5)",glow:"rgba(124,58,237,0.35)",tc:"#fff",sc:"rgba(255,255,255,0.8)"};
if(r===2)return{bg:"radial-gradient(circle at 35% 30%, rgba(196,181,253,0.9) 0%, rgba(139,92,246,0.8) 50%, rgba(109,40,217,0.85) 100%)",border:"rgba(139,92,246,0.5)",glow:"rgba(139,92,246,0.3)",tc:"#fff",sc:"rgba(255,255,255,0.75)"};
if(r===3)return{bg:"radial-gradient(circle at 35% 30%, rgba(221,214,254,0.9) 0%, rgba(167,139,250,0.8) 50%, rgba(139,92,246,0.85) 100%)",border:"rgba(167,139,250,0.5)",glow:"rgba(167,139,250,0.25)",tc:"#fff",sc:"rgba(255,255,255,0.75)"};
const l=96+Math.min(1,(r-3)/Math.max(1,t-3))*3;return{bg:`radial-gradient(circle at 35% 30%, hsl(263,50%,${Math.min(98,l+6)}%) 0%, hsl(263,40%,${l}%) 50%, hsl(263,35%,${Math.max(70,l-8)}%) 100%)`,border:`hsla(263,30%,${88+Math.min(1,(r-3)/Math.max(1,t-3))*6}%,0.5)`,glow:"transparent",tc:"#555",sc:"#999"};
}

function initLayout(nodes,W,H){
if(!nodes.length||!W||!H)return[];
const GAP=3,cx=W/2,so=nodes.map((n,i)=>({...n,idx:i})).sort((a,b)=>b.r-a.r);
const pos=so.map(n=>({x:cx+(Math.random()-.5)*W*.3,y:H-n.r-10,vx:0,vy:0,r:n.r,idx:n.idx}));
for(let t=0;t<600;t++){const a=Math.max(.001,1-t/600);for(let i=0;i<pos.length;i++){pos[i].vy+=.25*a;pos[i].vx+=(cx-pos[i].x)*.005*a;
for(let j=i+1;j<pos.length;j++){const dx=pos[i].x-pos[j].x,dy=pos[i].y-pos[j].y,ox=pos[i].r+pos[j].r+GAP-Math.abs(dx),oy=pos[i].r+pos[j].r+GAP-Math.abs(dy);
if(ox>0&&oy>0){const sx=dx>=0?1:-1,sy=dy>=0?1:-1;if(ox<oy){pos[i].vx+=sx*ox*.25;pos[j].vx-=sx*ox*.25;}else{pos[i].vy+=sy*oy*.25;pos[j].vy-=sy*oy*.25;}}}
pos[i].vx*=.55;pos[i].vy*=.55;pos[i].x+=pos[i].vx;pos[i].y+=pos[i].vy;const pd=pos[i].r+2;pos[i].x=Math.max(pd,Math.min(W-pd,pos[i].x));pos[i].y=Math.max(pd,Math.min(H-pd,pos[i].y));}}
const res=new Array(nodes.length);pos.forEach(p=>{res[p.idx]={x:p.x,y:p.y}});return res;
}

/* ===== 물리엔진 훅 ===== */
function usePhysics(items,dims,ds){
const sorted=[...items].sort((a,b)=>b.popularityScore-a.popularityScore);
const nodes=sorted.map((p,i)=>{const t=sorted.length,pct=t<=1?0:(i/(t-1));return{id:p.id,r:pct<.2?CUBE_L:pct<.55?CUBE_M:CUBE_S};});
const posRef=useRef([]);const frameRef=useRef(null);const[rendered,setRendered]=useState([]);
const key=items.map(i=>i.id).join(",");
useEffect(()=>{if(!dims.w||!dims.h||!nodes.length){posRef.current=[];setRendered([]);return;}
const b=getBounds(dims.w,dims.h),bw=b.right-b.left,bh=b.bottom-b.top;
const layout=initLayout(nodes,bw*.85,bh*.85);const ox=b.left+bw*.075,oy=b.top+bh*.075;
posRef.current=layout.map((p,i)=>({x:p.x+ox,y:p.y+oy,vx:0,vy:0,r:nodes[i].r,id:nodes[i].id}));
setRendered(posRef.current.map(p=>({x:p.x,y:p.y})));},[key,dims.w,dims.h]);
useEffect(()=>{if(!dims.w||!dims.h)return;const G=.18,FR=.88,BO=.35,GAP=3;
const step=()=>{const bodies=posRef.current;if(!bodies.length){frameRef.current=requestAnimationFrame(step);return;}
const d=ds.current,b=getBounds(dims.w,dims.h);
for(let i=0;i<bodies.length;i++){const o=bodies[i];if(d.dragging&&d.id===o.id){const pad=o.r+2;o.x=Math.max(b.left+pad,Math.min(b.right-pad,o.x));o.y=Math.max(b.top+pad,Math.min(b.bottom-pad,o.y));o.vx=d.velX||0;o.vy=d.velY||0;continue;}o.vy+=G;o.vx*=FR;o.vy*=FR;o.x+=o.vx;o.y+=o.vy;const pad=o.r+2;if(o.x<b.left+pad){o.x=b.left+pad;o.vx=Math.abs(o.vx)*BO;}if(o.x>b.right-pad){o.x=b.right-pad;o.vx=-Math.abs(o.vx)*BO;}if(o.y<b.top+pad){o.y=b.top+pad;o.vy=Math.abs(o.vy)*BO;}if(o.y>b.bottom-pad){o.y=b.bottom-pad;o.vy=-Math.abs(o.vy)*BO;}}
for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],bb=bodies[j],dx=a.x-bb.x,dy=a.y-bb.y,ox=a.r+bb.r+GAP-Math.abs(dx),oy=a.r+bb.r+GAP-Math.abs(dy);
if(ox>0&&oy>0){const aL=d.dragging&&d.id===a.id,bL=d.dragging&&d.id===bb.id,sx=dx>=0?1:-1,sy=dy>=0?1:-1;
if(ox<oy){if(aL){bb.x-=sx*ox;}else if(bL){a.x+=sx*ox;}else{a.x+=sx*ox*.5;bb.x-=sx*ox*.5;}if(!aL)a.vx*=.1;if(!bL)bb.vx*=.1;
}else{if(aL){bb.y-=sy*oy;}else if(bL){a.y+=sy*oy;}else{a.y+=sy*oy*.5;bb.y-=sy*oy*.5;}if(!aL){if(sy>0)a.vy=Math.min(a.vy,0);else a.vy=Math.max(a.vy,0);}if(!bL){if(sy<0)bb.vy=Math.min(bb.vy,0);else bb.vy=Math.max(bb.vy,0);}}}}
for(let i=0;i<bodies.length;i++){const o=bodies[i],pad=o.r+2;if(o.x<b.left+pad){o.x=b.left+pad;if(o.vx<0)o.vx*=-BO;}if(o.x>b.right-pad){o.x=b.right-pad;if(o.vx>0)o.vx*=-BO;}if(o.y<b.top+pad){o.y=b.top+pad;if(o.vy<0)o.vy*=-BO;}if(o.y>b.bottom-pad){o.y=b.bottom-pad;if(o.vy>0)o.vy*=-BO;}}
setRendered(bodies.map(o=>({x:o.x,y:o.y})));frameRef.current=requestAnimationFrame(step);};
frameRef.current=requestAnimationFrame(step);return()=>cancelAnimationFrame(frameRef.current);},[dims.w,dims.h,key]);
return{sorted,nodes,rendered,posRef};
}

function DecoToolbar({d,onFlip,onDown,onUp,onRemove,DMIN,DMAX}){

<div style={{width:1,height:16,background:"#e5e7eb",margin:"0 2px"}}/>
<button onClick={e=>{e.stopPropagation();onDown();}} style={{width:24,height:24,border:"none",borderRadius:7,background:d.scale<=DMIN?"#f5f5f5":"#f5f3ff",cursor:d.scale<=DMIN?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:d.scale<=DMIN?"#ccc":"#7c3aed"}}>−</button>
<span style={{fontSize:10,fontWeight:700,color:"#7c3aed",minWidth:32,textAlign:"center"}}>{Math.round(d.scale*100)}%</span>
<button onClick={e=>{e.stopPropagation();onUp();}} style={{width:24,height:24,border:"none",borderRadius:7,background:d.scale>=DMAX?"#f5f5f5":"#f5f3ff",cursor:d.scale>=DMAX?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:d.scale>=DMAX?"#ccc":"#7c3aed"}}>+</button>
<div style={{width:1,height:16,background:"#e5e7eb",margin:"0 2px"}}/>
<button onClick={e=>{e.stopPropagation();onRemove();}} style={{width:24,height:24,border:"none",borderRadius:7,background:"#fef2f2",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#ef4444",fontWeight:700}}>✕</button>
</div>);
}

<button onClick={()=>setShowShareModal(true)} style={{position:"absolute",bottom:12,right:12,zIndex:20,width:40,height:40,borderRadius:12,border:"none",background:"rgba(255,255,255,0.85)",backdropFilter:"blur(8px)",boxShadow:"0 2px 12px rgba(0,0,0,0.1), 0 0 0 1px rgba(124,58,237,0.15)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}} onMouseEnter={e=>{e.currentTarget.style.background="#f5f3ff";e.currentTarget.style.transform="scale(1.08)";e.currentTarget.style.boxShadow="0 4px 16px rgba(124,58,237,0.2), 0 0 0 1.5px rgba(124,58,237,0.3)";}} onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.85)";e.currentTarget.style.transform="scale(1)";e.currentTarget.style.boxShadow="0 2px 12px rgba(0,0,0,0.1), 0 0 0 1px rgba(124,58,237,0.15)";}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
</div></div>

{/* 우측: 아이템 */}
<div style={{flex:"0 0 220px",minWidth:200,maxWidth:240,display:"flex",flexDirection:"column",gap:16}}>
<div style={{background:"#fff",borderRadius:16,border:"1px solid #e0d8f5",overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.04)"}}>
<div style={{padding:"14px 14px",borderBottom:"1px solid #f3f4f6",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
<span style={{fontSize:13,fontWeight:700,color:"#111"}}>담은 아이템</span>
<div style={{background:"#f5f3ff",padding:"2px 8px",borderRadius:10}}><span style={{fontSize:11,color:"#7c3aed",fontWeight:700}}>{items.length}</span></div>
</div>
{items.length===0&&<div style={{padding:"30px 14px",textAlign:"center",color:"#ccc",fontSize:12}}>아직 담긴 아이템이 없어요</div>}
<div style={{overflow:"hidden"}}>
{(itemsExpanded?sorted:sorted.slice(0,VISIBLE+1)).map((item,i)=>{const isSel=selected===item.id,rk=i+1,isHalf=!itemsExpanded&&i===VISIBLE&&sorted.length>VISIBLE;
return(<div key={item.id} onClick={()=>setSelected(isSel?null:item.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:"1px solid #f5f5f5",background:isSel?"#f5f3ff":"transparent",cursor:"pointer",borderLeft:isSel?"3px solid #7c3aed":"3px solid transparent",maxHeight:isHalf?28:"none",overflow:isHalf?"hidden":"visible",opacity:isHalf?.4:1,maskImage:isHalf?"linear-gradient(to bottom,black 0%,transparent 100%)":"none",WebkitMaskImage:isHalf?"linear-gradient(to bottom,black 0%,transparent 100%)":"none"}}>
<div style={{width:36,height:36,borderRadius:10,flexShrink:0,background:isSel?"#ede9fe":"#f5f3ff",display:"flex",alignItems:"center",justifyContent:"center",border:`1.5px solid ${isSel?"#c4b5fd":"#e0d8f5"}`,position:"relative"}}>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" strokeWidth="1.7"><circle cx="12" cy="12" r="10"/></svg>
{rk<=3&&<div style={{position:"absolute",top:-3,right:-3,width:15,height:15,borderRadius:"50%",background:rk===1?"#FFD700":rk===2?"#C0C0C0":"#CD7F32",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:900,color:rk===1?"#7a5a00":rk===2?"#444":"#5a2d00",border:"1.5px solid #fff"}}>{rk}</div>}
</div>
<div style={{flex:1,minWidth:0}}><span style={{fontSize:12,fontWeight:650,color:"#111",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block"}}>{item.name}</span>
<div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}><span style={{fontSize:10,color:"#999"}}>{item.brand}</span>{item.rating&&<><span style={{fontSize:9,color:"#e0e0e0"}}>·</span><span style={{fontSize:10,color:"#f59e0b"}}>★ {item.rating}</span></>}</div></div>
<button onClick={e=>{e.stopPropagation();removeItem(item.id);}} style={{border:"none",background:"none",cursor:"pointer",color:"#ddd",fontSize:12,padding:3,borderRadius:6,width:22,height:22,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}} onMouseEnter={e=>{e.currentTarget.style.color="#ef4444";e.currentTarget.style.background="#fef2f2";}} onMouseLeave={e=>{e.currentTarget.style.color="#ddd";e.currentTarget.style.background="none";}}>✕</button>
</div>);})}
</div>
{hasMore&&<button onClick={()=>setItemsExpanded(v=>!v)} style={{width:"100%",padding:10,border:"none",borderTop:"1px solid #f3f4f6",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:4,fontSize:11,fontWeight:600,color:"#7c3aed"}}>{itemsExpanded?"접기":`더보기 (${sorted.length-VISIBLE}개)`}</button>}
</div>

<button style={{width:"100%",padding:10,border:"none",borderRadius:10,background:"#9333EA",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:12,fontWeight:700,boxShadow:"0 4px 12px rgba(147,51,234,0.25)"}}>
<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#fff" strokeWidth="1.5"/><path d="M8 5.5V10.5M5.5 8H10.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round"/></svg>
더 담으러 가기</button>

{selItem&&(()=>{const rk=sorted.findIndex(s=>s.id===selItem.id)+1,rs=getRankStyle(rk,sorted.length);
return(<div style={{background:"#fff",borderRadius:16,border:"1px solid #e0d8f5",overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.04)",animation:"slideUp .3s ease"}}>
<div style={{padding:16,borderBottom:"1px solid #f3f4f6",display:"flex",alignItems:"center",gap:8}}>
<div style={{width:32,height:32,borderRadius:8,background:"#f5f3ff",display:"flex",alignItems:"center",justifyContent:"center",border:"1.5px solid #e0d8f5"}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" strokeWidth="1.7"><circle cx="12" cy="12" r="10"/></svg></div>
<div><div style={{fontSize:14,fontWeight:700,color:"#111"}}>{selItem.name}</div><div style={{fontSize:11,color:"#999"}}>{selItem.brand}</div></div>
<div style={{marginLeft:"auto",background:rk<=3?rs.bg:"#f5f3ff",color:rk<=3?rs.tc:"#7c3aed",fontSize:11,fontWeight:800,padding:"3px 10px",borderRadius:8}}>#{rk}</div>
</div>
{selItem.imageUrl&&<div style={{margin:"12px 16px 0",height:110,borderRadius:10,border:"1px solid #e0d8f5",overflow:"hidden",background:`url(${selItem.imageUrl}) center/cover no-repeat`}}/>}
<div style={{padding:"12px 16px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
<div style={{background:"#f5f3ff",borderRadius:10,padding:"10px 12px",textAlign:"center"}}><div style={{fontSize:10,color:"#999",marginBottom:2}}>평점</div><div style={{fontSize:16,fontWeight:800,color:"#7c3aed"}}>★ {selItem.rating}</div></div>
<div style={{background:"#f5f3ff",borderRadius:10,padding:"10px 12px",textAlign:"center"}}><div style={{fontSize:10,color:"#999",marginBottom:2}}>리뷰</div><div style={{fontSize:16,fontWeight:800,color:"#7c3aed"}}>{(selItem.reviewCount/1000).toFixed(1)}K</div></div>
<div style={{gridColumn:"1/-1",background:"#f5f3ff",borderRadius:10,padding:"10px 12px",textAlign:"center"}}><div style={{fontSize:10,color:"#999",marginBottom:2}}>인기도</div><div style={{fontSize:16,fontWeight:800,color:"#7c3aed"}}>{selItem.popularityScore.toLocaleString()}</div></div>
</div></div>);})()}
</div>

</div></div>

{/* 공유 모달 */}
{showShareModal&&<div onClick={()=>setShowShareModal(false)} style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,0.5)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
<div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:24,padding:"32px 28px 24px",maxWidth:360,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.2)",animation:"modalIn .25s ease"}}>
<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
<span style={{fontSize:16,fontWeight:700,color:"#111"}}>내 캐꾸 공유하기</span>
<button onClick={()=>setShowShareModal(false)} style={{border:"none",background:"#f3f4f6",width:28,height:28,borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#888",fontWeight:700}}>✕</button>
</div>
<div style={{borderRadius:16,overflow:"hidden",border:"1px solid #e0d8f5",background:shareBg}}>
<div style={{width:280,aspectRatio:"380/480"}}>
<svg ref={shareRef} width="380" height="480" viewBox="-40 -40 380 480" fill="none" xmlns="http://www.w3.org/2000/svg" style={{width:"100%",height:"100%",display:"block"}}>
<defs><linearGradient id="sG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={skin.body.grad1}/><stop offset="100%" stopColor={skin.body.grad2}/></linearGradient></defs>
<rect x="-40" y="-40" width="380" height="480" fill={shareBg}/>
{nickname&&<text className="nick-text" x="150" y="-20" textAnchor="middle" fontSize="20" fontWeight="700" fill="#363636" fontFamily="'HancomMalangMalang',sans-serif">{nickname}의 캐꾸</text>}
<rect x="30" y="50" width="240" height="320" rx="20" fill="url(#sG2)" stroke={skin.body.stroke} strokeWidth="3"/>
<line x1="52" y1="122" x2="52" y2="289" stroke="#fff" strokeWidth="6" strokeLinecap="round" opacity=".3"/>
<rect x="122" y="18" width="8" height="35" rx="3" fill={skin.handle.fill} stroke={skin.handle.stroke} strokeWidth="1.5"/><rect x="170" y="18" width="8" height="35" rx="3" fill={skin.handle.fill} stroke={skin.handle.stroke} strokeWidth="1.5"/>
<rect x="116" y="6" width="68" height="18" rx="9" fill={skin.handle.grip} stroke={skin.handle.stroke} strokeWidth="2.5"/>
<rect x="98" y="80" width="22" height="250" rx="11" fill={skin.groove.fill} stroke={skin.groove.stroke} strokeWidth="2"/><rect x="139" y="80" width="22" height="250" rx="11" fill={skin.groove.fill} stroke={skin.groove.stroke} strokeWidth="2"/><rect x="180" y="80" width="22" height="250" rx="11" fill={skin.groove.fill} stroke={skin.groove.stroke} strokeWidth="2"/>
{!(activeMyIdx>=0&&decos.length>0)&&skin.stickers.map((st,i)=><Sticker key={i} s={st}/>)}
{decos.map((d,i)=>{const x=30+(d.x/100)*240,y=50+(d.y/100)*320,sz=Math.round(24*d.scale);return<foreignObject key={"sd"+i} x={x-sz/2} y={y-sz/2} width={sz} height={sz}><div xmlns="http://www.w3.org/1999/xhtml" style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:sz*.85,lineHeight:1,transform:d.flipped?"scaleX(-1)":"scaleX(1)"}}>{d.emoji}</div></foreignObject>;})}
<g transform="rotate(-4,126,53)"><line x1="126" y1="53" x2="126" y2="78" stroke={skin.body.stroke} strokeWidth="1.5" opacity=".4" strokeLinecap="round"/><rect x="97" y="78" width="58" height="76" rx="4" fill="#fff" fillOpacity=".92" stroke={skin.body.stroke} strokeWidth="1.2" opacity=".6"/><circle cx="126" cy="86" r="3" fill="none" stroke={skin.body.stroke} strokeWidth=".8" opacity=".3"/><line x1="98" y1="96" x2="154" y2="96" stroke={skin.body.stroke} strokeWidth=".5" opacity=".15"/>{nameTagImg?<><defs><clipPath id="ntC2"><rect x="99" y="98" width="54" height="54" rx="3"/></clipPath></defs><image href={nameTagImg} x="99" y="98" width="54" height="54" preserveAspectRatio="xMidYMid slice" clipPath="url(#ntC2)"/></>:<text textAnchor="middle" fontSize="11" fontWeight="800" fill={skin.body.stroke} opacity=".5" fontFamily="monospace" letterSpacing="1"><tspan x="126" y="120">PHOTO</tspan><tspan x="126" dy="14">TAG</tspan></text>}</g>
<rect x="62" y="365" width="16" height="8" rx="3" fill={skin.wheel.fill} stroke={skin.wheel.stroke} strokeWidth="1.5"/><circle cx="70" cy="382" r="10" fill={skin.wheel.fill} stroke={skin.wheel.stroke} strokeWidth="2"/><circle cx="70" cy="382" r="2" fill={skin.wheel.hub}/>
<rect x="222" y="365" width="16" height="8" rx="3" fill={skin.wheel.fill} stroke={skin.wheel.stroke} strokeWidth="1.5"/><circle cx="230" cy="382" r="10" fill={skin.wheel.fill} stroke={skin.wheel.stroke} strokeWidth="2"/><circle cx="230" cy="382" r="2" fill={skin.wheel.hub}/>
</svg>
</div>
</div>
<div style={{marginTop:12,display:"flex",alignItems:"center",gap:8}}>
<input value={nickname} onChange={e=>setNickname(e.target.value)} placeholder="닉네임 입력" maxLength={10} style={{flex:1,padding:"8px 12px",border:"1.5px solid #e0d8f5",borderRadius:10,fontSize:13,outline:"none",fontFamily:"'Noto Sans KR',sans-serif",color:"#333",background:"#faf8ff"}} onFocus={e=>e.target.style.borderColor="#7c3aed"} onBlur={e=>e.target.style.borderColor="#e0d8f5"}/>
<span style={{fontSize:12,color:"#888",fontWeight:600,whiteSpace:"nowrap"}}>의 캐꾸</span>
</div>
<button onClick={saveAsImage} style={{width:"100%",marginTop:10,padding:12,border:"none",borderRadius:12,background:"linear-gradient(135deg,#7c3aed,#9333ea)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 4px 12px rgba(124,58,237,0.3)"}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>이미지 저장하기</button>
</div>
</div>}
<input ref={nameTagInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={onNameTagImgChange}/>
</div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
